name: Publish academic homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack static homepage
        run: |
          mkdir -p out
          unzip -q site.zip -d out
          test -f out/index.html
          touch out/.nojekyll
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
